<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)"/>

  <!-- Centered Safe-Zone Content (Scale 0.8) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Glowing NFC Wave Arcs -->
    <g filter="url(#glowM)">
      <path d="M 285 190 A 65 65 0 0 1 330 256 A 65 65 0 0 1 285 322" 
            fill="none" stroke="url(#accentGradM)" stroke-width="22" stroke-linecap="round"/>
      <path d="M 325 150 A 120 120 0 0 1 405 256 A 120 120 0 0 1 325 362" 
            fill="none" stroke="url(#primaryGradM)" stroke-width="24" stroke-linecap="round"/>
      <path d="M 365 110 A 175 175 0 0 1 480 256 A 175 175 0 0 1 365 402" 
            fill="none" stroke="url(#accentGradM)" stroke-width="26" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>

    <!-- Smartphone Device -->
    <g filter="url(#glowM)">
      <rect x="100" y="96" width="180" height="320" rx="36" fill="#0b0f19" stroke="url(#primaryGradM)" stroke-width="12"/>
      <rect x="116" y="128" width="148" height="256" rx="20" fill="#131828"/>
      <rect x="162" y="110" width="56" height="6" rx="3" fill="#475569"/>
      
      <circle cx="190" cy="240" r="44" fill="url(#primaryGradM)" fill-opacity="0.2"/>
      <circle cx="190" cy="240" r="28" fill="url(#primaryGradM)"/>
      <path d="M 190 220 L 194 234 L 208 234 L 197 243 L 201 257 L 190 248 L 179 257 L 183 243 L 172 234 L 186 234 Z" fill="#ffffff"/>

      <rect x="160" y="396" width="60" height="4" rx="2" fill="#475569"/>
    </g>
  </g>
</svg>
