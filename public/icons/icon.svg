<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing NFC Wave Arcs (Back/Behind) -->
  <g filter="url(#glow)">
    <!-- Wave 1 (Small) -->
    <path d="M 285 190 A 65 65 0 0 1 330 256 A 65 65 0 0 1 285 322" 
          fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Wave 2 (Medium) -->
    <path d="M 325 150 A 120 120 0 0 1 405 256 A 120 120 0 0 1 325 362" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Wave 3 (Large) -->
    <path d="M 365 110 A 175 175 0 0 1 480 256 A 175 175 0 0 1 365 402" 
          fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Smartphone Device (Front) -->
  <g filter="url(#glow)">
    <!-- Phone Body -->
    <rect x="100" y="96" width="180" height="320" rx="36" fill="#0b0f19" stroke="url(#primaryGrad)" stroke-width="12"/>
    <!-- Screen -->
    <rect x="116" y="128" width="148" height="256" rx="20" fill="#131828"/>
    <!-- Speaker Bar -->
    <rect x="162" y="110" width="56" height="6" rx="3" fill="#475569"/>
    
    <!-- NFC Target / Star on Phone Screen -->
    <circle cx="190" cy="240" r="44" fill="url(#primaryGrad)" fill-opacity="0.2"/>
    <circle cx="190" cy="240" r="28" fill="url(#primaryGrad)"/>
    <path d="M 190 220 L 194 234 L 208 234 L 197 243 L 201 257 L 190 248 L 179 257 L 183 243 L 172 234 L 186 234 Z" fill="#ffffff"/>

    <!-- Home indicator -->
    <rect x="160" y="396" width="60" height="4" rx="2" fill="#475569"/>
  </g>
</svg>
